<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="4" fill="#1a1a1a"/>
  <!-- Spreadsheet grid lines -->
  <rect x="4" y="4" width="24" height="24" rx="1" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="0.5"/>
  <!-- Column header -->
  <rect x="4" y="4" width="24" height="6" rx="1" fill="#333"/>
  <!-- Row header column -->
  <rect x="4" y="4" width="7" height="24" rx="1" fill="#333"/>
  <!-- Grid lines horizontal -->
  <line x1="4" y1="10" x2="28" y2="10" stroke="#444" stroke-width="0.5"/>
  <line x1="4" y1="16" x2="28" y2="16" stroke="#444" stroke-width="0.5"/>
  <line x1="4" y1="22" x2="28" y2="22" stroke="#444" stroke-width="0.5"/>
  <!-- Grid lines vertical -->
  <line x1="11" y1="4" x2="11" y2="28" stroke="#444" stroke-width="0.5"/>
  <line x1="18" y1="4" x2="18" y2="28" stroke="#444" stroke-width="0.5"/>
  <line x1="25" y1="4" x2="25" y2="28" stroke="#444" stroke-width="0.5"/>
  <!-- Highlighted active cell -->
  <rect x="11" y="10" width="7" height="6" fill="rgba(100,220,100,0.15)" stroke="#6bdc6b" stroke-width="0.8"/>
  <!-- S letter in header area -->
  <text x="5.5" y="9" font-family="monospace" font-size="5" fill="#888" font-weight="bold">A1</text>
</svg>